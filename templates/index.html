<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Chatbot</title>
  <style>
    :root{--bg:#f6f8fb;--user:#0b63d6;--bot:#e6e9ef}
    body { font-family: Arial, sans-serif; margin: 2rem; background:var(--bg); }
    .container{max-width:800px;margin:0 auto}
    #chat { background:white;border-radius:8px;padding:1rem;height:420px;overflow-y:auto;box-shadow:0 6px 18px rgba(20,20,40,0.06)}
    .message{display:flex;margin:0.6rem 0;align-items:flex-end}
    .bubble{max-width:75%;padding:0.6rem 0.9rem;border-radius:14px;line-height:1.3}
    .user{justify-content:flex-end}
    .user .bubble{background:linear-gradient(90deg,#1e88e5,#0b63d6);color:white;border-bottom-right-radius:4px}
    .bot{justify-content:flex-start}
    .bot .bubble{background:var(--bot);color:#111;border-bottom-left-radius:4px}
    #inputRow{display:flex;gap:8px;margin-top:12px}
    #msg{flex:1;padding:10px 12px;border-radius:8px;border:1px solid #dfe6f0}
    button{padding:9px 12px;border-radius:8px;border:none;background:#0b63d6;color:white;cursor:pointer}
    .controls{margin-top:10px;display:flex;gap:8px}
    .muted{color:#666;font-size:0.9rem}
    #typing{display:none;margin-top:6px;color:#666}
  </style>
</head>
<body>
  <div class="container">
    <h2>Simple Chatbot</h2>
    <div id="chat"></div>

    <div id="typing" class="muted">Bot is typing...</div>

    <div id="inputRow">
      <input id="msg" placeholder="Type your message" />
      <button id="send">Send</button>
    </div>

    <div class="controls">
      <button id="btnJoke" style="background:#ff8c42">Tell me a joke</button>
      <button id="btnCalc" style="background:#6a9ef8">Calculate</button>
      <button id="btnClear" style="background:#999">Clear</button>
    </div>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
